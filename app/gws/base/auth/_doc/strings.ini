[de]
gws.base.auth.manager.Config = Konfiguration der Authentifizierung.
gws.base.auth.manager.Config.methods = Verfügbare Authentifizierungsmethoden.
gws.base.auth.manager.Config.mfa = Multifaktor-Adapter.
gws.base.auth.manager.Config.providers = Authentifizierungs-Provider.
gws.base.auth.manager.Config.session = Sitzungsverwaltung.
gws.base.auth.manager.Config.throttle = Begrenzung fehlgeschlagener Anmeldeversuche zum Schutz vor Brute-Force-Angriffen.
gws.base.auth.method.Config.secure = Beschränkung auf SSL/TLS-Verbindungen.
gws.base.auth.mfa.Config.lifeTime = Gültigkeitsdauer von MFA-Codes in Sekunden.
gws.base.auth.mfa.Config.maxRestarts = Maximale Anzahl an Neugenerierungen von MFA-Codes.
gws.base.auth.mfa.Config.maxVerifyAttempts = Maximale Anzahl an Verifizierungsversuchen.
gws.base.auth.mfa.Config.message = MFA-Anweisung im Client.
gws.base.auth.mfa.Config.otp = Konfiguration der One-Time-Password-Generierung.
gws.base.auth.mfa.OtpConfig = Konfiguration der OTP-Generierung.
gws.base.auth.mfa.OtpConfig.algo = Hash-Algorithmus für OTP (SHA1, SHA256, SHA512).
gws.base.auth.mfa.OtpConfig.length = Stellenanzahl des OTP-Codes.
gws.base.auth.mfa.OtpConfig.start = Referenz-Timestamp für TOTP-Berechnung.
gws.base.auth.mfa.OtpConfig.step = Gültigkeitsintervall eines TOTP-Codes in Sekunden.
gws.base.auth.mfa.OtpConfig.tolerance = Anzahl zusätzlicher Zeitfenster für TOTP-Akzeptanz.
gws.base.auth.provider.Config.allowedMethods = Erlaubte Authentifizierungsmethoden.
gws.base.auth.session_manager.Config.lifeTime = Sitzungsablaufzeit, gerechnet ab der letzten Anfrage; eine inaktive Sitzung endet nach dieser Zeitspanne.
gws.base.auth.session_manager.Config.maxLifeTime = Absolute Sitzungsdauer, gerechnet ab der Anmeldung.
gws.base.auth.throttle.Config = Konfiguration der Begrenzung fehlgeschlagener Authentifizierungsversuche.
gws.base.auth.throttle.Config.allowFrom = Adressen, die von der Begrenzung ausgenommen sind.
gws.base.auth.throttle.Config.blockTime = Sperrdauer, nachdem die maximale Anzahl der Versuche erreicht wurde.
gws.base.auth.throttle.Config.maxAttemptsPerIp = Anzahl fehlgeschlagener Versuche von einer Adresse, die zur Sperrung führt.
gws.base.auth.throttle.Config.maxAttemptsPerUser = Anzahl fehlgeschlagener Versuche für einen Anmeldenamen von allen Adressen, die zur Sperrung führt, 0=keine Begrenzung.
gws.base.auth.throttle.Config.path = Pfad zur Speicherdatei der Zählerstände.
gws.base.auth.throttle.Config.windowTime = Zeitraum, in dem fehlgeschlagene Versuche gezählt werden.
