<div class="geoservices_description">
    <div class="geoservices_head">
        <div>
            <p class="head2">{title | html | nl2br}</p>
            @with subtitle
                <p class="head3">{subtitle | html | nl2br}</p>
            @end
            @with details
                <p class="head3">{details | html | nl2br}</p>
            @end
        </div>
        @with icon
            <img class="geoservices_icon" src="{icon | html}" />
        @end
    </div>
</div>
