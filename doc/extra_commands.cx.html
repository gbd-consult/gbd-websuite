%def ref(name)
<span class="see_ref">
    <a href="<% options.webRoot %>/admin-de/reference/index.html#<% name %>"><% name %></a>
</span>
%end

%def demo(uid)
<span class="see_demo">
    <a target="_blank" href="https://docs.gbd-websuite.de/demo/<% uid %>"><% options.demoProjects.get(uid, uid) %></a>
</span>
%end

%def pyapi(name)
<a href="<% options.webRoot %>/<% options.pyapi_url(name) %>" title="<% name %>"><code><% name.split('.')[-1] %></code></a>
%end
