[de]
gws.base.auth.manager.Config = Authentifizierungsmethoden, Provider, Sitzungen und Begrenzung von Anmeldeversuchen.
gws.base.auth.manager.Config.methods = Anmeldemethoden, die Benutzern zur Verfügung stehen.
gws.base.auth.manager.Config.mfa = Multifaktor-Adapter.
gws.base.auth.manager.Config.providers = Benutzerquellen, die Anmeldedaten prüfen.
gws.base.auth.manager.Config.session = Speicherung und Lebensdauer von Sitzungen.
gws.base.auth.manager.Config.throttle = Sperrung nach wiederholt fehlgeschlagenen Anmeldeversuchen, ohne Angabe deaktiviert.
gws.base.auth.method.Config.secure = Anmeldedaten nur über HTTPS annehmen.
gws.base.auth.method.Config = Gemeinsame Optionen für Authentifizierungsmethoden.
gws.base.auth.method.Config.allowInsecureFrom = IP-Adressen, die diese Methode ohne HTTPS verwenden dürfen.
gws.base.auth.mfa.Config.lifeTime = Zeit, in der der MFA-Schritt abgeschlossen werden muss.
gws.base.auth.mfa.Config.maxRestarts = Wie oft ein neuer Code angefordert werden kann.
gws.base.auth.mfa.Config.maxVerifyAttempts = Erlaubte Code-Eingaben, bevor der MFA-Schritt fehlschlägt.
gws.base.auth.mfa.Config.message = Nachricht, die dem Benutzer im MFA-Schritt angezeigt wird.
gws.base.auth.mfa.Config.otp = Konfiguration der OTP-Generierung.
gws.base.auth.mfa.OtpConfig = Optionen für die Erzeugung von Einmalpasswörtern.
gws.base.auth.mfa.OtpConfig.algo = Hash-Algorithmus für die Code-Erzeugung.
gws.base.auth.mfa.OtpConfig.length = Anzahl der Stellen des Codes.
gws.base.auth.mfa.OtpConfig.start = Startzeit der TOTP-Zählung als Unix-Zeitstempel.
gws.base.auth.mfa.OtpConfig.step = TOTP-Zeitschritt in Sekunden.
gws.base.auth.mfa.OtpConfig.tolerance = Akzeptierte Zeitschritte vor und nach dem aktuellen.
gws.base.auth.provider.Config.allowedMethods = Authentifizierungsmethoden, die dieser Provider akzeptiert.
gws.base.auth.session_manager.Config.lifeTime = Sitzungsablaufzeit, gerechnet ab der letzten Anfrage; eine inaktive Sitzung endet nach dieser Zeitspanne.
gws.base.auth.session_manager.Config.maxLifeTime = Absolute Sitzungsdauer, gerechnet ab der Anmeldung.
gws.base.auth.throttle.Config = Sperrung nach wiederholt fehlgeschlagenen Authentifizierungsversuchen.
gws.base.auth.throttle.Config.allowFrom = IP-Adressen, die von der Begrenzung ausgenommen sind.
gws.base.auth.throttle.Config.blockTime = Sperrdauer, nachdem die maximale Anzahl der Versuche erreicht wurde.
gws.base.auth.throttle.Config.maxAttemptsPerIp = Anzahl fehlgeschlagener Versuche von einer Adresse, die zur Sperrung führt.
gws.base.auth.throttle.Config.maxAttemptsPerUser = Fehlversuche je Anmeldename von beliebigen Adressen vor der Sperrung, 0 für keine Begrenzung.
gws.base.auth.throttle.Config.path = Datei, in der fehlgeschlagene Versuche gespeichert werden.
gws.base.auth.throttle.Config.windowTime = Zeitraum, in dem fehlgeschlagene Versuche gezählt werden.
