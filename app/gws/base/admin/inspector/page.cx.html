<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GWS object inspector</title>
<link rel="stylesheet" href="{url}page.css&v={version}">
</head>
<body>
<div id="sidebar">
    <div id="search">
        <input id="search-input" type="text" placeholder="search: text or prop=text" autocomplete="off">
        <button id="search-clear" type="button" title="clear">&times;</button>
        <button id="search-button" type="button">search</button>
        <div id="search-spinner" title="searching, esc to stop"></div>
    </div>
    <div id="nodes"></div>
</div>
<div id="main">
    <div id="crumbs"></div>
    <div id="content">
        <div id="label"></div>
        <div id="props"></div>
    </div>
</div>
<script id="config" type="application/json">{configJson}</script>
<script src="{url}page.js&v={version}"></script>
</body>
</html>
