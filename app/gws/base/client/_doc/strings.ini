[de]
gws.base.client.core.Config = UI-Elemente und Optionen des Browser-Clients.
gws.base.client.core.Config.addElements = Elemente, die zur geerbten Elementliste der Applikation hinzugefügt werden.
gws.base.client.core.Config.elements = UI-Elemente des Clients, ersetzen die geerbte Liste der Applikation.
gws.base.client.core.Config.options = Client-Optionen, zusammengeführt mit den Client-Optionen der Applikation.
gws.base.client.core.Config.removeElements = Elemente, die aus der geerbten Elementliste der Applikation entfernt werden.
gws.base.client.core.ElementConfig = UI-Element des Clients.
gws.base.client.core.ElementConfig.after = Tag des Elements, nach dem dieses eingefügt wird.
gws.base.client.core.ElementConfig.before = Tag des Elements, vor dem dieses eingefügt wird.
gws.base.client.core.ElementConfig.options = Elementspezifische Optionen, die an den Client übergeben werden.
gws.base.client.core.ElementConfig.tag = Tag-Identifier des UI-Elements.
