<p class="uiLink geoservices_teaser">
    <span>
        <b>{title | html}</b>
        @with subtitle
            <br />{subtitle | html}
        @end
        @with teaser
            <br /><small>{teaser | html}</small>
        @end
    </span>
    @with icon
        <img class="geoservices_icon" src="{icon | html}" />
    @end
</p>
