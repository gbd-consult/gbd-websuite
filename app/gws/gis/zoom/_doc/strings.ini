[de]
gws.gis.zoom.Config = Zoomstufen einer Karte oder eines Layers, als Maßstäbe oder Stufen angegeben.
gws.gis.zoom.Config.initLevel = Zoomstufe beim Öffnen der Karte.
gws.gis.zoom.Config.initResolution = Anfangsauflösung.
gws.gis.zoom.Config.initScale = Maßstab beim Öffnen der Karte, auf die nächste Zoomstufe gerundet.
gws.gis.zoom.Config.maxLevel = Feinste Zoomstufe.
gws.gis.zoom.Config.maxResolution = Max. Auflösung.
gws.gis.zoom.Config.maxScale = Größte Maßstabszahl, auf die nächste Zoomstufe gerundet.
gws.gis.zoom.Config.minLevel = Gröbste Zoomstufe.
gws.gis.zoom.Config.minResolution = Min. Auflösung.
gws.gis.zoom.Config.minScale = Kleinste Maßstabszahl, auf die nächste Zoomstufe gerundet.
gws.gis.zoom.Config.resolutions = Erlaubte Auflösungen.
gws.gis.zoom.Config.scales = Maßstabszahlen der Zoomstufen.
