gws.plugin.auth_provider.ldap.UserSpec.memberOf = LDAP-Filter für Gruppen, in denen das Konto Mitglied sein muss.
gws.plugin.auth_provider.ldap.UserSpec.roles = GWS-Rollen, die passenden Konten zugewiesen werden.
