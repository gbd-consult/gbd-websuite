[de]
gws.gis.cache.core.GlobalConfig = Globale Optionen des Kachel-Caches.
gws.gis.cache.core.GlobalConfig.seedingConcurrency = Anzahl paralleler Threads beim Seeding.
gws.gis.cache.core.GlobalConfig.seedingMaxTime = Zeitlimit für einen Seeding-Lauf.
gws.gis.cache.core.LayerConfig = Einstellungen des Kachel-Caches eines Layers.
gws.gis.cache.core.LayerConfig.crs = KBS, in denen Kacheln gecacht werden.
gws.gis.cache.core.LayerConfig.maxAge = Maximales Alter der gecachten Kacheln.
gws.gis.cache.core.LayerConfig.maxLevel = Feinste zu cachende Zoomstufe.
gws.gis.cache.core.LayerConfig.name = Name des Cache-Verzeichnisses.
gws.gis.cache.core.LayerConfig.requestBuffer = Pixelpuffer um Anfragen an die Quelle, damit Beschriftungen über Kachelgrenzen hinweg stimmig bleiben.
gws.gis.cache.core.LayerConfig.requestTiles = Kacheln je Seite des Blocks, der in einer Quellanfrage gerendert wird.
