[de]
gws.base.database.layer.Config.dbUid = UID des Datenbank-Providers.
gws.base.database.layer.Config.tableName = Tabellenname, optional mit Schema.
gws.base.database.manager.Config = Datenbankverbindungen für Layer, Modelle und andere Objekte.
gws.base.database.manager.Config.providers = Datenbankverbindungen.
gws.base.database.model.Config.dbUid = UID des Datenbank-Providers.
gws.base.database.model.Config.sqlFilter = SQL-Bedingung, die jeder Abfrage des Modells hinzugefügt wird.
gws.base.database.model.Config.tableName = Datenbanktabelle des Modells.
gws.base.database.provider.Config.pool = Optionen des Verbindungspools.
gws.base.database.provider.Config.schemaCacheLifeTime = Wie lange aus der Datenbank gelesene Tabellenstrukturen gecacht werden.
gws.base.database.provider.Config.withPool = Datenbankverbindungen in einem Pool halten und wiederverwenden.
gws.base.database.auth_provider.Config.authorizationSql = SQL-Abfrage, die die Anmeldedaten prüft.
gws.base.database.auth_provider.Config.dbUid = UID des Datenbank-Providers.
gws.base.database.auth_provider.Config.getUserSql = SQL-Abfrage, die den Benutzerdatensatz für den Platzhalter {uid} liefert.
